name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  check:
    # Only on the private repo, not again on the public mirror
    if: github.repository == 'PLISMUN-ORG/Website'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Takes the version from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
